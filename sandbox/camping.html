<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weekend camping trip</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
    h1 { color: #2d5a3d; }
    h2 { margin-top: 2rem; }
    .checklist { list-style: none; padding: 0; }
  </style>
</head>
<body>
  <h1>Weekend camping trip</h1>
  <p>Two nights by the lake. Bring warm layers and good snacks.</p>

  <h2>Campsite</h2>
  <p>Pine Lake, site 14. Check-in is after 2 pm.</p>

  <h2>Packing checklist</h2>
  <ul class="checklist">
    <li><label><input type="checkbox"> Tent and sleeping bags</label></li>
    <li><label><input type="checkbox"> Warm layers and rain jacket</label></li>
    <li><label><input type="checkbox"> Headlamp and spare batteries</label></li>
    <li><label><input type="checkbox"> Water bottles and snacks</label></li>
    <li><label><input type="checkbox"> Camp stove and lighter</label></li>
    <li><label><input type="checkbox"> First-aid kit</label></li>
  </ul>
</body>
</html>
